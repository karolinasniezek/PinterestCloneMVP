steps:
  - task: NodeTool@0
    displayName: "Use Node.js 22"
    inputs:
      versionSpec: "22.x"

  - script: npm ci
    displayName: "1. Install dependencies"

  - script: npm run lint
    displayName: "2. Run ESLint"

  - script: npm run build
    displayName: "3. Build React application"

  - script: npm test
    displayName: "4. Run unit tests"
